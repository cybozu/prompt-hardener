name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version tag to publish (e.g. v0.5.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            v="${GITHUB_REF_NAME}"
          else
            v="${{ inputs.version }}"
          fi

          if [[ ! "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            echo "Invalid version: $v"
            echo "Expected semver like v0.4.0 (optionally with -rc.1, +meta)"
            exit 1
          fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Takumi Guard for PyPI
        uses: flatt-security/setup-takumi-guard-pypi@7d825811bb293b9e0230477165442580a0074280 # v1.0.0
        with:
          bot-id: "BT01KNJSJ9PGFWK3H5T7NM3D4NSD"

      - name: Export Takumi Guard index for uv
        shell: bash
        run: |
          set -euo pipefail
          : "${PIP_INDEX_URL:?PIP_INDEX_URL is not set}"
          echo "UV_INDEX_URL=${PIP_INDEX_URL}" >> "$GITHUB_ENV"

      - name: Verify tag exists
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_tag.outputs.tag }}"

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag does not exist locally after checkout: ${tag}"
            exit 1
          fi

          if ! git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Tag does not exist on origin: ${tag}"
            exit 1
          fi

      - name: Build Python package (wheel)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade uv
          uv build --no-sources

      - name: Verify wheel artifact exists
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'dist/*.whl' >/dev/null || {
            echo "Expected at least one wheel in dist/"
            exit 1
          }

      # Separate build from release so build-time code never runs with release-capable permissions.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/*.whl
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist

      - name: Verify downloaded wheel artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'dist/*.whl' >/dev/null || {
            echo "Expected at least one downloaded wheel in dist/"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          prerelease: ${{ contains(needs.build.outputs.tag, '-rc.') || contains(needs.build.outputs.tag, '-beta') || contains(needs.build.outputs.tag, '-alpha') }}
          tag_name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: |
            dist/*.whl
