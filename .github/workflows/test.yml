name: Pytest

on:
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Takumi Guard for PyPI
        uses: flatt-security/setup-takumi-guard-pypi@7d825811bb293b9e0230477165442580a0074280 # v1.0.0
        with:
          bot-id: "BT01KNJSJ9PGFWK3H5T7NM3D4NSD"
      - name: Export Takumi Guard index for uv
        shell: bash
        run: |
          set -euo pipefail
          : "${PIP_INDEX_URL:?PIP_INDEX_URL is not set}"
          echo "UV_INDEX_URL=${PIP_INDEX_URL}" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: |
          python -m pip install --upgrade uv
      - name: Sync dependencies
        run: |
          uv sync --frozen --extra dev
      - name: Run tests
        run: |
          uv run --frozen --no-sync pytest --maxfail=1 --disable-warnings -q
